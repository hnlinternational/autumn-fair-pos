<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#17201C">
<title>Autumn Fair 주문판</title>
<style>
/* 오래된 안드로이드 크롬에서도 돌아가도록 flex gap, env(), max() 같은 최신 CSS는 쓰지 않아요 */
:root{
  --bg:#F2F4F3; --surface:#FFFFFF; --sunk:#E6EAE8; --ink:#17201C; --muted:#5E6B66; --line:#D3DAD7;
  --accent:#D9531E; --ok:#1F8A4C; --ok-soft:#DDF1E4; --warn:#B7791F; --warn-soft:#FBEFD5; --bad:#C2362B; --bad-soft:#F8DEDA;
  --c-bul:#8C3B22; --c-tteok:#D23B3B; --c-hot:#C8901A; --c-drink:#1F7F86;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#F2F4F3;background:var(--bg);color:#17201C;color:var(--ink);
  font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",Roboto,sans-serif;font-size:15px;
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input{font:inherit}
.app{max-width:1400px;margin:0 auto;padding:0 16px}
.bar{display:-webkit-box;display:flex;-webkit-box-align:center;align-items:center;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
.bar > *{margin:3px 6px 3px 0}
.brand{font-size:22px;font-weight:800;margin-right:auto !important}
.tabs{background:var(--sunk);border-radius:999px;padding:4px;white-space:nowrap}
.tabs button{padding:9px 20px;border-radius:999px;font-weight:700;color:var(--muted);position:relative}
.tabs button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.dot{display:inline-block;min-width:20px;height:20px;border-radius:10px;background:var(--accent);color:#fff;font-size:12px;line-height:20px;padding:0 6px;margin-left:6px;text-align:center}
.pill{font-size:12px;font-weight:700;padding:6px 10px;border-radius:999px}
.pill.live{background:var(--ok-soft);color:var(--ok)} .pill.local{background:var(--warn-soft);color:var(--warn)} .pill.err{background:var(--bad-soft);color:var(--bad)}
.iconbtn{padding:9px 12px;border-radius:10px;background:var(--sunk);font-weight:700;font-size:13px}
main{padding:14px 0 24px}

/* 주문 */
.order{display:-webkit-box;display:flex;-webkit-box-align:start;align-items:flex-start}
.menu{-webkit-box-flex:1;flex:1;min-width:0;margin-right:16px}
.cat{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--muted);margin:6px 0 8px}
.row{display:grid;grid-template-columns:1fr 1fr 1fr;grid-gap:12px;margin-bottom:10px}
.tile{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 16px 16px;text-align:left;min-height:190px;overflow:hidden;display:block;width:100%}
.tile.sm{min-height:130px}
.tile:active{background:var(--sunk)}
.tile .stripe{position:absolute;left:0;right:0;top:0;height:7px}
.tile .kr{display:block;font-size:30px;font-weight:800;line-height:1.15;padding-right:40px}
.tile.sm .kr{font-size:24px}
.tile .en{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.tile .price{position:absolute;left:16px;bottom:14px;font-weight:700;font-size:18px}
.tile .q{position:absolute;top:14px;right:12px;min-width:36px;height:36px;border-radius:18px;color:#fff;font-size:20px;font-weight:800;line-height:36px;text-align:center;padding:0 8px}
.tile.out{opacity:.4}
.cart{width:360px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;position:sticky;top:70px}
.cart h2{margin:0 0 10px;font-size:20px;overflow:hidden}
.cart h2 span{float:right;font-size:13px;color:var(--muted);font-weight:500;margin-top:5px}
.empty{color:var(--muted);font-size:14px;padding:14px;border:2px dashed var(--line);border-radius:10px;text-align:center}
.line{display:-webkit-box;display:flex;-webkit-box-align:center;align-items:center;margin-bottom:8px}
.line .nm{-webkit-box-flex:1;flex:1;min-width:0;font-weight:600}
.line .nm small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.step{background:var(--sunk);border-radius:10px;white-space:nowrap;margin:0 8px}
.step button{width:42px;height:42px;font-size:22px;font-weight:700}
.step b{display:inline-block;min-width:20px;text-align:center}
.line .amt{min-width:72px;text-align:right;font-weight:700}
.total{background:var(--ink);color:#fff;border-radius:12px;padding:14px 18px;margin:12px 0;overflow:hidden}
.total.zero{background:var(--sunk);color:var(--muted)}
.total .lab{float:left;font-weight:700;font-size:16px;margin-top:12px}
.total .lab small{display:block;font-weight:400;font-size:13px;opacity:.75}
.total b{float:right;font-size:50px;font-weight:800;line-height:1}
.go{display:block;width:100%;background:var(--accent);color:#fff;border-radius:12px;padding:18px;font-size:20px;font-weight:800}
.go.dis{opacity:.4}
.check{display:block;font-size:13px;color:var(--muted);margin:0 0 10px}
.check input{width:18px;height:18px;vertical-align:middle;margin-right:6px}
.ghost{display:block;margin:10px auto 0;color:var(--muted);font-size:13px;text-decoration:underline}

/* 주방 */
.ktop{overflow:hidden;margin-bottom:12px}
.chips{float:left}
.chip{padding:10px 18px;border-radius:999px;border:2px solid var(--line);font-weight:700;background:var(--surface);margin:0 6px 6px 0}
.chip.on{border-color:var(--ink);background:var(--ink);color:#fff}
.sound{float:right;padding:10px 16px}
.sound.on{background:var(--ok-soft);color:var(--ok)}
.lanes{display:grid;grid-template-columns:2.4fr 1.2fr 1fr;grid-gap:14px;-webkit-box-align:start;align-items:start}
.lane{background:var(--sunk);border-radius:14px;padding:12px;min-height:220px;min-width:0}
.lane h3{margin:0 0 10px;font-size:13px;color:var(--muted);overflow:hidden}
.lane h3 b{float:right;color:var(--ink);font-size:16px}
.cook .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));grid-gap:10px}
.card{background:var(--surface);border-radius:12px;border:1px solid var(--line);border-left:7px solid var(--line);padding:12px;margin-bottom:10px}
.cook .card{margin-bottom:0}
.card.new{-webkit-animation:pop 1.6s ease-out;animation:pop 1.6s ease-out}
@-webkit-keyframes pop{0%{box-shadow:0 0 0 7px #D9531E}100%{box-shadow:0 0 0 0 rgba(0,0,0,0)}}
@keyframes pop{0%{box-shadow:0 0 0 7px #D9531E}100%{box-shadow:0 0 0 0 rgba(0,0,0,0)}}
.card.warn{border-left-color:var(--warn)} .card.bad{border-left-color:var(--bad);background:var(--bad-soft)} .card.ready{border-left-color:var(--ok)}
.card .hd{display:-webkit-box;display:flex;-webkit-box-pack:justify;justify-content:space-between;-webkit-box-align:center;align-items:center;margin-bottom:10px}
.card .no{font-size:42px;font-weight:800;line-height:1}
.card .age{font-size:15px;font-weight:700;color:var(--muted)}
.card.warn .age{color:var(--warn)} .card.bad .age{color:var(--bad)}
.it{display:-webkit-box;display:flex;-webkit-box-align:center;align-items:center;width:100%;min-height:84px;text-align:left;padding:12px 12px 12px 16px;border-radius:14px;background:#fff;border:2px solid var(--line);border-left:14px solid #999;margin-bottom:10px;font-size:26px;font-weight:800;line-height:1.3}
.it:active{background:var(--sunk)}
.it .nm{-webkit-box-flex:1;flex:1;min-width:0}
.it .mk{margin-left:10px;padding:16px 18px;border-radius:12px;background:var(--ink);color:#fff;font-size:19px;font-weight:800;white-space:nowrap}
.it.done{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.it.done .nm{text-decoration:line-through}
.it.done .mk{background:var(--ok)}
.acts{display:grid;grid-template-columns:1fr 1.6fr;grid-gap:8px;margin-top:4px}
.acts button{padding:18px 8px;border-radius:12px;font-weight:800;font-size:18px;background:var(--sunk)}
.acts .serve{background:var(--ok);color:#fff;font-size:20px}
.acts .serve.dim{background:var(--sunk);color:var(--muted)}
.ready .it,.held .it{font-size:19px;min-height:64px;border-left-width:10px;padding-left:10px}
.ready .it .mk,.held .it .mk{font-size:14px;padding:10px 10px}
.ready .acts,.held .acts,.acts.one{grid-template-columns:1fr}
.still{font-size:14px;font-weight:700;color:var(--warn);background:var(--warn-soft);border-radius:8px;padding:8px 10px;margin-bottom:8px}

/* 정산 */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);grid-gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kpi span{font-size:12px;font-weight:700;color:var(--muted)}
.kpi b{display:block;font-size:32px;font-weight:800;margin-top:4px}
.kpi.hi{background:var(--ink);color:#fff;border-color:var(--ink)} .kpi.hi span{color:#ccc}
.sales{display:grid;grid-template-columns:1.2fr 1fr;grid-gap:16px;-webkit-box-align:start;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0;margin-bottom:16px}
.panel h3{margin:0 0 10px;font-size:15px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{font-size:12px;color:var(--muted)}
th:first-child,td:first-child{text-align:left}
tfoot td{font-weight:700;border-bottom:0}
.mbar{height:8px;border-radius:4px}
.box .r{overflow:hidden;padding:6px 0}
.box .r span{float:left;margin-top:6px} .box .r b,.box .r input{float:right}
.box input{width:120px;padding:8px;border-radius:8px;border:1px solid var(--line);text-align:right;-webkit-user-select:text;user-select:text}
.box .sum{border-top:1px solid var(--line);font-weight:700}
.box .sum b{font-size:26px}
.hist{max-height:440px;overflow:auto;-webkit-overflow-scrolling:touch}
.h{overflow:hidden;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.h .no{float:left;width:52px;font-size:20px;font-weight:800}
.h .txt{float:left;max-width:60%}
.h .txt small{color:var(--muted)}
.h .rt{float:right;text-align:right}
.st{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.st.served{background:var(--ok-soft);color:var(--ok)} .st.cancelled{background:var(--bad-soft);color:var(--bad)} .st.open,.st.held{background:var(--warn-soft);color:var(--warn)}
.h.cx{opacity:.5}
.h button{font-size:12px;font-weight:700;padding:6px 8px;border-radius:8px;margin-left:4px}
.h .cxb{color:var(--bad)} .h .y{background:var(--bad);color:#fff} .h .n{background:var(--sunk)}
.copy{margin-top:10px;padding:10px 14px;border-radius:10px;background:var(--sunk);font-weight:700;font-size:13px}
textarea.copied{width:100%;height:160px;margin-top:8px;-webkit-user-select:text;user-select:text}

/* 모달, 토스트 */
.scrim{position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(10,14,12,.55);z-index:20;overflow:auto;padding:16px}
.modal{background:var(--surface);border-radius:16px;padding:20px;max-width:560px;margin:20px auto}
.modal h2{margin:0 0 8px;font-size:24px}
.modal p{margin:0 0 12px;color:var(--muted);font-size:13px}
.mrow{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px}
.mrow .g{display:grid;grid-template-columns:1fr 160px;grid-gap:8px;margin-bottom:8px}
.mrow input,.mrow select{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:15px;-webkit-user-select:text;user-select:text}
.mrow .pri{text-align:right}
.mrow label{display:block;font-size:11px;color:var(--muted);font-weight:700;margin-bottom:3px}
.mrow .ctl{overflow:hidden}
.mrow .ctl button{padding:9px 12px;border-radius:8px;background:var(--sunk);font-weight:700;font-size:13px;margin-right:6px;float:left}
.mrow .ctl button[disabled]{opacity:.3}
.mrow .ctl .so.on{background:var(--bad-soft);color:var(--bad)}
.mrow .ctl .del{float:right;margin-right:0;color:var(--bad)}
.mrow .ctl .del.ask{background:var(--bad);color:#fff}
.addm{display:block;width:100%;padding:14px;border-radius:12px;border:2px dashed var(--line);font-weight:700;color:var(--muted);margin-top:4px}
.mfoot{text-align:right;margin-top:12px}
.mfoot button{padding:12px 18px;border-radius:10px;font-weight:700;background:var(--sunk);margin-left:6px}
.mfoot .p{background:var(--accent);color:#fff}
.danger{border-top:1px solid var(--line);margin-top:16px;padding-top:12px;font-size:13px;color:var(--muted)}
.danger input{width:60%;padding:9px;border-radius:8px;border:1px solid var(--line);margin-top:8px;-webkit-user-select:text;user-select:text}
.danger button{padding:10px 14px;border-radius:8px;background:var(--bad);color:#fff;font-weight:700;margin-left:6px}
.danger button.dis{opacity:.4}
.toast{position:fixed;left:50%;bottom:24px;-webkit-transform:translateX(-50%);transform:translateX(-50%);background:var(--ink);color:#fff;padding:14px 22px;border-radius:14px;z-index:30;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.3);white-space:nowrap}
.toast b{font-size:40px;vertical-align:middle;margin-right:12px}
.toast span{display:inline-block;vertical-align:middle}
.toast small{display:block;opacity:.7;font-weight:400}

@media (max-width:980px){
  .order{display:block}.menu{margin-right:0}.cart{width:auto;position:static;margin-top:10px}
  .lanes,.sales{grid-template-columns:1fr}.cook .cards{grid-template-columns:1fr}
}
@media (max-width:600px){
  .tile{min-height:120px;padding:16px 10px 10px}.tile .kr,.tile.sm .kr{font-size:19px;padding-right:0}.tile .en{display:none}
  .tile .q{top:6px;right:6px;min-width:28px;height:28px;line-height:28px;font-size:15px}
  .kpis{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <div class="brand">Autumn Fair 주문판</div>
    <div class="tabs">
      <button id="tab-order" data-v="order">주문</button><button id="tab-kitchen" data-v="kitchen">주방</button><button id="tab-sales" data-v="sales">정산</button>
    </div>
    <span id="sync" class="pill local">연결 중…</span>
    <button id="btn-settings" class="iconbtn">메뉴·가격</button>
  </div>
  <main id="view"></main>
</div>
<div id="overlay"></div>

<script src="config.js"></script>
<script>
/* ES5만 사용 (화살표 함수, 템플릿 문자열, async 없음) — 오래된 갤럭시탭 크롬 호환용 */
(function(){
"use strict";
var CFG = window.FAIR_CONFIG || {};
var URL_BASE = (CFG.supabaseUrl || "").replace(/\/$/, "");
var KEY = CFG.supabaseKey || "";
var REMOTE = !!(URL_BASE && KEY);
var POLL_MS = 2000;

var STATIONS = [{id:"bul",name:"불고기",c:"#8C3B22"},{id:"tteok",name:"떡볶이",c:"#D23B3B"},{id:"hot",name:"핫도그",c:"#C8901A"},{id:"etc",name:"기타 음식",c:"#5B6C9A"},{id:"drink",name:"음료",c:"#1F7F86"}];
var ST = {}; for (var si=0; si<STATIONS.length; si++) ST[STATIONS[si].id] = STATIONS[si];
var DEFAULT_MENU = [
 {id:"m1",kr:"불고기 덮밥",en:"Bulgogi Rice",price:150,st:"bul",out:false},
 {id:"m2",kr:"떡볶이",en:"Tteokbokki",price:100,st:"tteok",out:false},
 {id:"m3",kr:"핫도그",en:"Hot Dog",price:100,st:"hot",out:false},
 {id:"m4",kr:"밀키스 오리지널",en:"Milkis Original",price:50,st:"drink",out:false},
 {id:"m5",kr:"밀키스 피치",en:"Milkis Peach",price:50,st:"drink",out:false},
 {id:"m6",kr:"밀키스 딸기",en:"Milkis Strawberry",price:50,st:"drink",out:false}];

/* ---------- 작은 도구들 ---------- */
function nt(n){ n = Math.round(n||0); var s = String(Math.abs(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ","); return (n<0?"-":"") + s + " NT$"; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function lsGet(k,d){ try{ var v = localStorage.getItem(k); return v==null ? d : JSON.parse(v); }catch(e){ return d; } }
function lsSet(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function each(a,f){ for (var i=0;i<a.length;i++) f(a[i],i); }
function filter(a,f){ var r=[]; for (var i=0;i<a.length;i++) if (f(a[i],i)) r.push(a[i]); return r; }
function map(a,f){ var r=[]; for (var i=0;i<a.length;i++) r.push(f(a[i],i)); return r; }
function find(a,f){ for (var i=0;i<a.length;i++) if (f(a[i])) return a[i]; return null; }
function keys(o){ var r=[]; for (var k in o) if (Object.prototype.hasOwnProperty.call(o,k)) r.push(k); return r; }
function assign(t){ for (var i=1;i<arguments.length;i++){ var s=arguments[i]; if(s) for (var k in s) if (Object.prototype.hasOwnProperty.call(s,k)) t[k]=s[k]; } return t; }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function ts(v){ return typeof v === "number" ? v : Date.parse(v); }

/* ---------- 상태 ---------- */
var hashView = (location.hash || "").replace("#","");
var S = {
  view: (hashView==="order"||hashView==="kitchen"||hashView==="sales") ? hashView : lsGet("pos.view","order"),
  orders: [], menu: DEFAULT_MENU, floatCash: 0, cart: {}, drinkNow: lsGet("pos.drinkNow", true),
  station: lsGet("pos.station","all"), sound: false, fresh: {}, confirmCancel: null, loaded: false
};

/* ---------- 서버 (Supabase REST, XHR) ---------- */
function api(method, path, body, cb, prefer){
  var x = new XMLHttpRequest();
  x.open(method, URL_BASE + "/rest/v1/" + path, true);
  x.setRequestHeader("apikey", KEY);
  if (KEY.indexOf("sb_") !== 0) x.setRequestHeader("Authorization", "Bearer " + KEY);
  x.setRequestHeader("Content-Type", "application/json");
  if (prefer) x.setRequestHeader("Prefer", prefer);
  x.timeout = 8000;
  x.onreadystatechange = function(){
    if (x.readyState !== 4) return;
    var ok = x.status >= 200 && x.status < 300, data = null;
    try { data = x.responseText ? JSON.parse(x.responseText) : null; } catch(e){}
    if (cb) cb(ok ? null : (x.status || "network"), data);
  };
  x.ontimeout = function(){};
  x.send(body == null ? null : JSON.stringify(body));
}
function rowToOrder(r){ return {id:r.id, no:r.no, items:r.items||[], total:r.total||0, status:r.status, done:r.done||{}, createdAt:ts(r.created_at)}; }

var local = { orders: lsGet("pos.local.orders", []), cfg: lsGet("pos.local.cfg", null) };
function saveLocal(){ lsSet("pos.local.orders", local.orders); lsSet("pos.local.cfg", local.cfg); }

var sync = { since: null, resetAt: null, lastFull: 0, rows: {} };
var store = REMOTE ? {
  /* 데이터 절약: 평소엔 바뀐 주문만 받고, 1분마다 한 번 전체를 다시 받아요 */
  load: function(cb){
    api("GET", "fair_config?select=menu,float_cash,reset_at&id=eq.1", null, function(err0, cfgRows){
      if (err0) return cb(err0);
      var cfg = cfgRows && cfgRows[0] ? cfgRows[0] : null;
      var full = !sync.since || Date.now() - sync.lastFull > 60000 || (cfg && cfg.reset_at !== sync.resetAt);
      var q = "fair_orders?select=*&order=id.asc";
      if (!full) q += "&updated_at=gt." + encodeURIComponent(new Date(Date.parse(sync.since) - 5000).toISOString());
      api("GET", q, null, function(err, rows){
        if (err) return cb(err);
        if (full){ sync.rows = {}; sync.lastFull = Date.now(); }
        if (cfg) sync.resetAt = cfg.reset_at;
        each(rows || [], function(r){ sync.rows[r.id] = r; if (!sync.since || r.updated_at > sync.since) sync.since = r.updated_at; });
        if (!sync.since) sync.since = new Date().toISOString();
        var list = map(keys(sync.rows), function(k){ return rowToOrder(sync.rows[k]); });
        list.sort(function(a, b){ return a.id - b.id; });
        cb(null, list, cfg);
      });
    });
  },
  add: function(o, cb){

var failCount = 0, knownIds = null;
function setSync(mode){
  var el = document.getElementById("sync");

  else if (mode === "err"){ el.className = "pill err"; el.innerHTML = "● 연결 끊김 · 인터넷 확인"; }
  else { el.className = "pill local"; el.innerHTML = "● 이 기기만 (서버 미설정)"; }
}
function sameOrders(a, b){ return JSON.stringify(a) === JSON.stringify(b); }
function poll(){
  store.load(function(err, orders, cfg){
    if (err){ failCount++; if (failCount >= 2) setSync("err"); return; }
    failCount = 0; setSync(REMOTE ? "live" : "local");
    var changed = !S.loaded;
    if (cfg){
      var m = cfg.menu && cfg.menu.length ? cfg.menu : DEFAULT_MENU, f = Number(cfg.float_cash)||0;
      if (JSON.stringify(m) !== JSON.stringify(S.menu) || f !== S.floatCash){ S.menu = m; S.floatCash = f; changed = true; }
    }
    if (knownIds){
      var added = filter(orders, function(o){ return !knownIds[o.id]; });
      if (added.length){
        var relevantNew = false;
        each(added, function(o){ S.fresh[o.id] = true; if (o.status==="open" && relevant(o)) relevantNew = true; });
        if (relevantNew) ding();
        setTimeout(function(){ each(added, function(o){ delete S.fresh[o.id]; }); }, 1700);
      }
    }
    knownIds = {}; each(orders, function(o){ knownIds[o.id] = true; });
    if (!sameOrders(orders, S.orders)){ S.orders = orders; changed = true; }
    S.loaded = true;
    if (changed && !isTyping()) render();
  });
}
function isTyping(){ var a = document.activeElement; return a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA"); }

function menuById(id){ return find(S.menu, function(m){ return m.id === id; }); }
function isOpen(o){ return o.status === "open" || o.status === "held"; }
function relevant(o){ return S.station === "all" || !!find(o.items, function(i){ return i.st === S.station; }); }
function stationsOf(o){ var seen = {}, r = []; each(o.items, function(i){ if (!seen[i.st]){ seen[i.st]=1; r.push(i.st); } }); return r; }
function allDone(o){ var s = stationsOf(o); for (var i=0;i<s.length;i++) if (!(o.done && o.done[s[i]])) return false; return true; }
function ageMin(o){ return Math.floor((Date.now() - o.createdAt) / 60000); }
function cartLines(){ var r = []; each(keys(S.cart), function(id){ var q = S.cart[id], m = menuById(id); if (q > 0 && m) r.push({m:m, q:q}); }); return r; }
function cartTotal(){ var t = 0; each(cartLines(), function(l){ t += l.m.price * l.q; }); return t; }

var actx = null, wake = null;
function ding(){
  if (!S.sound || !actx) return;
  try {
    var t = actx.currentTime;
    each([[880,0],[1318.5,0.18]], function(p){
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = "sine"; o.frequency.value = p[0];
      g.gain.setValueAtTime(0.0001, t+p[1]); g.gain.exponentialRampToValueAtTime(0.5, t+p[1]+0.02); g.gain.exponentialRampToValueAtTime(0.0001, t+p[1]+0.6);
      o.connect(g); g.connect(actx.destination); o.start(t+p[1]); o.stop(t+p[1]+0.65);
    });
  } catch(e){}
}
function toggleSound(){
  try { if (!actx){ var AC = window.AudioContext || window.webkitAudioContext; if (AC) actx = new AC(); } if (actx && actx.resume) actx.resume(); } catch(e){}
  S.sound = !S.sound;

}

/* 메뉴(주방)별로 따로 움직여요: 조리 완료된 부분은 바로 '나갈 준비 끝'으로, 나머지는 '조리 중'에 남아요 */

function toast(html){
  var old = document.querySelectorAll(".toast"); each(old, function(x){ x.parentNode.removeChild(x); });
  var t = document.createElement("div"); t.className = "toast"; t.innerHTML = html; document.body.appendChild(t);

}
var busy = false;

  var lines = cartLines(); if (busy || !lines.length) return; busy = true;
  var done = {}; if (S.drinkNow){ done.drink = true; done.$served = {drink: true}; }
  var o = {items: map(lines, function(l){ return {id:l.m.id, kr:l.m.kr, price:l.m.price, q:l.q, st:l.m.st}; }), total: cartTotal(), status: "open", done: done};
  var onlyDrinks = true; each(o.items, function(i){ if (i.st !== "drink" || !S.drinkNow) onlyDrinks = false; });
  if (onlyDrinks) o.status = "served";
  document.getElementById("go").innerHTML = "저장 중…";
  store.add(o, function(err, saved){
    busy = false;
    if (err || !saved){ toast("저장하지 못했어요. 인터넷을 확인하고 다시 눌러 주세요."); render(); return; }

    render();
  });
}

  store.update(id, patch, function(err){ if (err){ toast("저장하지 못했어요. 다시 눌러 주세요."); poll(); } });
}
function idOf(v){ var n = Number(v); return isNaN(n) ? v : n; }

document.addEventListener("click", function(e){
  var b = e.target; while (b && b.tagName !== "BUTTON") b = b.parentNode;
  if (!b || !b.getAttribute) return;
  var g = function(k){ return b.getAttribute("data-" + k); };
  if (g("v")){ S.view = g("v"); lsSet("pos.view", S.view); try { history.replaceState(null, "", "#" + S.view); } catch(x){} render(); return; }
  if (g("add")){ var m = menuById(g("add")); if (m && !m.out){ S.cart[m.id] = (S.cart[m.id]||0) + 1; render(); } return; }
  if (g("dec")){ S.cart[g("dec")] = Math.max(0, (S.cart[g("dec")]||0) - 1); render(); return; }
  if (b.id === "go"){ submit(); return; }
  if (b.id === "clear"){ S.cart = {}; render(); return; }
  if (g("st")){ S.station = g("st"); lsSet("pos.station", S.station); render(); return; }
  if (b.id === "sound"){ toggleSound(); return; }
  if (g("tog")){ var p = g("tog").split("|"), id = idOf(p[0]), o = find(S.orders, function(x){ return x.id === id; });
    if (o){ var nd = clone(o.done || {}); nd[p[1]] = !nd[p[1]]; upd(id, {done: nd}); } return; }
  if (g("servepart")){ var sid = idOf(g("servepart")), so = find(S.orders, function(x){ return x.id === sid; });

      each(partsFor(so, "ready"), function(s){ nd2.$served[s] = true; });
      var allServed = true; each(stationsOf(so), function(s){ if (!nd2.$served[s]) allServed = false; });
      upd(sid, allServed ? {status:"served", done: nd2} : {done: nd2}); } return; }
  if (g("hold")){ upd(idOf(g("hold")), {status:"held"}); return; }
  if (g("unhold")){ upd(idOf(g("unhold")), {status:"open"}); return; }
  if (g("cxask")){ S.confirmCancel = idOf(g("cxask")); render(); return; }
  if (g("cxno")){ S.confirmCancel = null; render(); return; }
  if (g("cx")){ S.confirmCancel = null; upd(idOf(g("cx")), {status:"cancelled"}); return; }
  if (b.id === "copy"){ copySummary(b); return; }
  if (b.id === "btn-settings"){ openSettings(); return; }
});

  var fallback = function(){ var out = document.getElementById("copyout"); out.innerHTML = '<textarea class="copied" readonly></textarea>'; var ta = out.firstChild; ta.value = txt; ta.focus(); ta.select();
    var ok = false; try { ok = document.execCommand("copy"); } catch(x){} if (ok) done(); else b.innerHTML = "아래 글을 길게 눌러 복사하세요"; };
  try { if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, fallback); else fallback(); } catch(x){ fallback(); }
}

/* 메뉴·가격 설정 */
function openSettings(){
  var draft = clone(S.menu), O = document.getElementById("overlay"), askDel = null;
  function trim(v){ return String(v).replace(/^\s+|\s+$/g, ""); }
  function rowHtml(m, i){
    var opts = map(STATIONS, function(k){ return '<option value="' + k.id + '"' + (m.st === k.id ? " selected" : "") + ">" + k.name + (k.id === "drink" ? " (아랫줄)" : " (윗줄)") + "</option>"; }).join("");
    return '<div class="mrow">' +
      '<div class="g"><div><label>메뉴 이름</label><input id="nm-' + m.id + '" value="' + esc(m.kr) + '" placeholder="예: 김밥"></div>' +
      '<div><label>가격 (NT$)</label><input class="pri" id="pr-' + m.id + '" type="number" inputmode="numeric" value="' + m.price + '"></div></div>' +
      '<div class="g"><div><label>영어 이름</label><input id="en-' + m.id + '" value="' + esc(m.en || "") + '" placeholder="예: Gimbap"></div>' +
      '<div><label>종류 · 주방</label><select id="st-' + m.id + '">' + opts + "</select></div></div>" +
      '<div class="ctl"><button data-up="' + m.id + '"' + (i === 0 ? " disabled" : "") + '>▲</button><button data-down="' + m.id + '"' + (i === draft.length - 1 ? " disabled" : "") + '>▼</button>' +
      '<button class="so' + (m.out ? " on" : "") + '" data-so="' + m.id + '">' + (m.out ? "품절" : "판매 중") + "</button>" +
      '<button class="del' + (askDel === m.id ? " ask" : "") + '" data-del="' + m.id + '">' + (askDel === m.id ? "한 번 더 누르면 삭제" : "삭제") + "</button></div></div>";
  }
  function draw(){
    var old = document.getElementById("scrim"), top = old ? old.scrollTop : 0;
    var h = '<div class="scrim" id="scrim"><div class="modal"><h2>메뉴 · 가격</h2><p>저장하면 모든 패드에 2초 안에 반영돼요. ▲▼로 순서를 바꾸고, 종류를 \'음료\'로 고르면 아랫줄, 나머지는 윗줄에 나와요. 이미 들어간 주문은 바뀌지 않아요.</p>';
    each(draft, function(m, i){ h += rowHtml(m, i); });
    h += '<button class="addm" id="m-add">+ 메뉴 추가</button>' +
      '<div class="mfoot"><button id="m-cancel">닫기</button><button class="p" id="m-save">저장</button></div>' +
      '<div class="danger">행사 전 연습 주문 지우기: 모든 주문 기록이 삭제되고 번호가 #1부터 다시 시작해요. 아래에 <b>초기화</b>라고 입력하세요.<br>' +
      '<input id="reset-txt" placeholder="초기화"><button id="m-reset" class="dis">주문 전부 삭제</button></div></div></div>';
    O.innerHTML = h;
    document.getElementById("scrim").scrollTop = top;
  }
  function sync(){ each(draft, function(m){
    var n = document.getElementById("nm-" + m.id), p = document.getElementById("pr-" + m.id), en = document.getElementById("en-" + m.id), st = document.getElementById("st-" + m.id);
    if (n) m.kr = trim(n.value); if (p) m.price = Math.max(0, Number(p.value) || 0);
    if (en) m.en = trim(en.value); if (st) m.st = st.value; }); }
  function idx(id){ for (var i=0;i<draft.length;i++) if (draft[i].id === id) return i; return -1; }
  function close(){ O.innerHTML = ""; O.onclick = null; O.oninput = null; render(); }
  draw();
  O.oninput = function(e){ if (e.target.id === "reset-txt"){ document.getElementById("m-reset").className = trim(e.target.value) === "초기화" ? "" : "dis"; } };
  O.onclick = function(e){
    if (e.target.id === "scrim"){ close(); return; }
    var b = e.target; while (b && b !== O && b.tagName !== "BUTTON") b = b.parentNode;
    if (!b || b === O || b.disabled) return;
    var g = function(k){ return b.getAttribute("data-" + k); };
    if (b.id === "m-cancel"){ close(); return; }
    if (g("so")){ sync(); var m = draft[idx(g("so"))]; m.out = !m.out; draw(); return; }
    if (g("up") || g("down")){ sync(); var i = idx(g("up") || g("down")), j = g("up") ? i - 1 : i + 1;
      if (j >= 0 && j < draft.length){ var t = draft[i]; draft[i] = draft[j]; draft[j] = t; } askDel = null; draw(); return; }
    if (g("del")){ sync(); if (askDel === g("del")){ draft.splice(idx(g("del")), 1); askDel = null; } else askDel = g("del"); draw(); return; }
    if (b.id === "m-add"){ sync(); askDel = null; draft.push({id: "m" + Date.now(), kr: "", en: "", price: 0, st: "etc", out: false}); draw();
      var sc = document.getElementById("scrim"); sc.scrollTop = sc.scrollHeight; var ni = document.getElementById("nm-" + draft[draft.length - 1].id); if (ni) ni.focus(); return; }
    if (b.id === "m-save"){ sync();
      if (!draft.length){ toast("메뉴가 하나는 있어야 해요."); return; }
      if (find(draft, function(x){ return !x.kr; })){ toast("이름이 빈 메뉴가 있어요. 이름을 적거나 삭제해 주세요."); return; }
      b.innerHTML = "저장 중…";
      store.setConfig(draft, S.floatCash, function(err){ if (err){ b.innerHTML = "저장"; toast("저장하지 못했어요. 다시 눌러 주세요."); return; }
        S.menu = draft; each(keys(S.cart), function(id){ if (!menuById(id)) delete S.cart[id]; }); close(); toast("메뉴를 저장했어요"); }); return; }
    if (b.id === "m-reset"){ if (b.className === "dis") return; b.innerHTML = "삭제 중…";
      store.reset(function(err){ if (err){ toast("삭제하지 못했어요. 다시 해 주세요."); b.innerHTML = "주문 전부 삭제"; return; } S.orders = []; knownIds = {}; close(); toast("주문 기록을 모두 지웠어요"); poll(); }); }
  };
}

setSync(REMOTE ? "live" : "local");
render();
poll();
setInterval(function(){ if (!document.hidden) poll(); }, POLL_MS);
setInterval(function(){ if (S.view === "kitchen" && !isTyping()) render(); }, 20000);
})();
</script>
